# ==============================================================
# CONFIGURATION GÉNÉRALE
# ==============================================================
spring.application.name=consulttrack
server.port=8081

# ==============================================================
# BASE DE DONNÉES (PostgreSQL)
# ==============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/consult_track_db
spring.datasource.username=consult_track_user
spring.datasource.password=admin

# ==============================================================
# JPA / HIBERNATE
# ==============================================================
# Indispensable pour mettre à jour les colonnes (typePrestation, jiraTicket, etc.) sans perdre les données
spring.jpa.hibernate.ddl-auto=update

# Affichage et formatage des requêtes SQL dans la console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Dialecte spécifique pour PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================
# SÉCURITÉ (OAuth2 / Keycloak)
# ==============================================================
# Résout l'erreur JwtDecoder au démarrage en définissant l'émetteur des jetons
# Assurez-vous que Keycloak est lancé sur le port 8080 et que le realm existe
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/consulttrack-realm

# ==============================================================
# LOGGING (Optionnel - utile pour le debug)
# ==============================================================
