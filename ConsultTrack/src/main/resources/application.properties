# ==============================================================
# CONFIGURATION GÉNÉRALE
# ==============================================================
spring.application.name=consulttrack
server.port=8081

# ==============================================================
# BASE DE DONNÉES (PostgreSQL)
# ==============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/consult_track_db
spring.datasource.username=consult_track_user
spring.datasource.password=admin

# ==============================================================
# JPA / HIBERNATE
# ==============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==============================================================
# JWT CUSTOM (sans Keycloak)
# ==============================================================
# Secret base64-encoded HMAC-SHA256 (>= 256 bits). À CHANGER en prod.
app.jwt.secret=Y29uc3VsdHRyYWNrLXNlY3JldC1jaGFuZ2UtbWUtaW4tcHJvZHVjdGlvbi0yMDI2LWNkZw==
app.jwt.expiration-ms=86400000

